version: '3'
services:
  nats:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -m 8222
  nats-with-jwt-nkey:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4221:4222"
      - "8221:8222"
    command: -js -m 8222 -c /credentials/server.conf
    volumes:
      - ./credentials:/credentials:ro
    depends_on:
      credentials-generator:
        condition: service_completed_successfully
  nats-with-auth:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4224:4222"
      - "8224:8222"
    command: -js -m 8222 --user ruser --pass T0pS3cr3t
  nats-with-certs:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4220:4222"
      - "8220:8222"
    command: -js -m 8222 --tls --tlscert=/certs/server-cert.pem --tlskey=/certs/server-key.pem --tlscacert=/certs/rootCA.pem --tlsverify
    volumes:
      - ./certs:/certs:ro
    depends_on:
      certs-generator:
        condition: service_completed_successfully
  # A three node cluster, for exercising connect_urls discovery and failover.
  #
  # client_advertise is essential: without it each node advertises its own
  # container address, which is unreachable from the host the tests run on, so
  # every discovered server would fail to connect.
  nats-cluster-1:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4231:4222"
      - "8231:8222"
    command: >
      -m 8222 --name node1
      --cluster_name test-cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats-cluster-1:6222,nats://nats-cluster-2:6222,nats://nats-cluster-3:6222
      --client_advertise 127.0.0.1:4231
  nats-cluster-2:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4232:4222"
      - "8232:8222"
    command: >
      -m 8222 --name node2
      --cluster_name test-cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats-cluster-1:6222,nats://nats-cluster-2:6222,nats://nats-cluster-3:6222
      --client_advertise 127.0.0.1:4232
  nats-cluster-3:
    image: nats:$NATS_IMAGE_TAG
    restart: unless-stopped
    ports:
      - "4233:4222"
      - "8233:8222"
    command: >
      -m 8222 --name node3
      --cluster_name test-cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats-cluster-1:6222,nats://nats-cluster-2:6222,nats://nats-cluster-3:6222
      --client_advertise 127.0.0.1:4233
  credentials-generator:
    image: natsio/nats-box:latest
    volumes:
      - ./scripts:/app:ro
      - ./credentials:/credentials
    working_dir: /app
    command: sh generate-credentials.sh
  certs-generator:
    image: goodeggs/mkcert
    entrypoint: /bin/bash
    volumes:
      - ./scripts:/app:ro
      - ./certs:/certs
    working_dir: /app
    command: generate-certs.sh
